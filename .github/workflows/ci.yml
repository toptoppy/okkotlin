name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile, Lint & Run Tests (Root & KMP)
        run: ./gradlew ktlintCheck detekt check test :kmp-core:allTests :kmp-core:ktlintCheck :kmp-core:detekt --info

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/reports/tests/test/
